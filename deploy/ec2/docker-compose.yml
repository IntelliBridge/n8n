# Flow production stack — single EC2 instance (i-038a90bc1fc8c0a79) behind ALB torqflow-staging.
# This file is the deployment unit for prod. The k8s/helm/terraform assets that used to live
# in this repo were never applied and remain on the legacy/1.90-master branch only.
#
# Secrets come from /opt/flow/.env on the instance (see .env.example). Never commit real values.
#
# 2.x requirements encoded here (do not remove):
#   - runners sidecar: Code nodes execute in an external task runner in 2.x
#   - N8N_DEFAULT_BINARY_DATA_MODE=filesystem: in-memory binary data mode was removed in 2.x
#     (prod ran "default"/in-memory on 1.90 — this is a required change)
#   - runner image version MUST match the n8n image version

services:
  n8n:
    image: ${ECR_REGISTRY}/flow:${FLOW_IMAGE_TAG}
    restart: unless-stopped
    ports:
      - '5678:5678'
    environment:
      # --- database (RDS flowdb, PostgreSQL 17) ---
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${DB_POSTGRESDB_HOST}
      - DB_POSTGRESDB_PORT=${DB_POSTGRESDB_PORT:-5432}
      - DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE:-n8n}
      - DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER}
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD}
      # RDS flowdb enforces SSL (verified 2026-06-12: non-SSL connections rejected)
      - DB_POSTGRESDB_SSL_ENABLED=true
      - DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED=false
      # --- core ---
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_HOST=${N8N_HOST:-flow.buildworkforce.ai}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_HOST:-flow.buildworkforce.ai}/
      - NODE_ENV=production
      # Heap size carried from prod (t3.2xlarge has 32 GB; prod set 8 GB)
      - NODE_OPTIONS=--max_old_space_size=8000
      # MUST match prod: prod 1.90 left GENERIC_TIMEZONE unset → UTC. Changing this
      # shifts every Schedule/Cron trigger by the offset, so keep UTC unless workflow
      # owners explicitly want a change.
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
      # n8n-nodes-torqdata embedder target (verified present in prod env 2026-06-12).
      # Value embeds OpenSearch basic-auth creds → comes from Secrets Manager, never the repo.
      - OPENSEARCH_HOST=${OPENSEARCH_HOST}
      # NOTE: prod 1.90 also set WEBHOOK_TUNNEL_URL (long-deprecated) — intentionally
      # dropped here; WEBHOOK_URL above is the supported replacement.
      # --- 2.x: binary data must be on disk (in-memory mode removed) ---
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      # --- 2.x: external task runners (Code node execution) ---
      # N8N_RUNNERS_ENABLED is deprecated in 2.25 (runners are on by default) — verified
      # via local boot test: setting it logs a deprecation warning, so it's omitted.
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      # --- product knobs (config-over-code: replaces old source patches) ---
      - N8N_TEMPLATES_ENABLED=false
      - N8N_HIRING_BANNER_ENABLED=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # --- security policy (Phase 1 audit may add written exceptions) ---
      # NODES_EXCLUDE / N8N_BLOCK_ENV_ACCESS_IN_NODE / N8N_RESTRICT_FILE_ACCESS_TO:
      # keep 2.x secure defaults; do not relax without a recorded decision.
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:5678/healthz || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
    # broker port 5679 stays on the compose network only — never publish it

  runners:
    # Official runner image, version-matched to the n8n image (no rebrand needed for a sidecar)
    image: n8nio/runners:${N8N_VERSION}
    restart: unless-stopped
    environment:
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
    depends_on:
      n8n:
        condition: service_healthy

volumes:
  n8n_data:
