apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flow.fullname" . }}
  namespace: {{ .Values.namespace | default "flow" }}
  labels:
    {{- include "flow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "flow.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flow.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.port }}
          name: http
        envFrom:
        - configMapRef:
            name: {{ include "flow.fullname" . }}-config
        - secretRef:
            name: {{ include "flow.fullname" . }}-secrets
        {{- if .Values.persistence.enabled }}
        volumeMounts:
        - name: flow-storage
          mountPath: /home/node/.n8n
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.persistence.enabled }}
      volumes:
      - name: flow-storage
        persistentVolumeClaim:
          claimName: {{ include "flow.fullname" . }}-pvc
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}