name: Infrastructure

on:
  push:
    branches: [main, master]
    paths: ['terraform/**']
  pull_request:
    branches: [main, master]
    paths: ['terraform/**']
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.6.0

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Init
      working-directory: terraform
      run: terraform init

    - name: Terraform Validate
      working-directory: terraform
      run: terraform validate

    - name: Terraform Plan
      working-directory: terraform
      run: terraform plan -var="n8n_encryption_key=${{ secrets.N8N_ENCRYPTION_KEY }}" -var="opensearch_host=${{ secrets.OPENSEARCH_HOST }}" -var="db_password=${{ secrets.DB_PASSWORD }}"

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      working-directory: terraform
      run: terraform apply -auto-approve -var="n8n_encryption_key=${{ secrets.N8N_ENCRYPTION_KEY }}" -var="opensearch_host=${{ secrets.OPENSEARCH_HOST }}" -var="db_password=${{ secrets.DB_PASSWORD }}"