name: Application

on:
  push:
    branches: [main, master]
    paths: ['src/**', 'docker/**', 'helm/**', 'packages/**', '*.json', '*.js', '*.ts']
  pull_request:
    branches: [main, master]
    paths: ['src/**', 'docker/**', 'helm/**', 'packages/**', '*.json', '*.js', '*.ts']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy'
        required: false
        default: ''

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: flow
  CLUSTER_NAME: flow-cluster
  HELM_CHART_PATH: ./helm/flow

jobs:
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{date 'YYYY.MM.DD'}}-
          type=raw,value=${{ github.event.inputs.image_tag }},enable=${{ github.event.inputs.image_tag != '' }}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/images/n8n-custom/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64

    - name: Run security scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.meta.outputs.tags }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: '3.12.0'

    - name: Extract image tag
      id: extract-tag
      run: |
        IMAGE_TAG=$(echo "${{ needs.build.outputs.image-tag }}" | cut -d':' -f2)
        echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

    - name: Deploy with Helm
      run: |
        helm upgrade --install flow ${{ env.HELM_CHART_PATH }} \
          --namespace flow \
          --create-namespace \
          --set image.tag=${{ steps.extract-tag.outputs.tag }} \
          --set secrets.N8N_ENCRYPTION_KEY="${{ secrets.N8N_ENCRYPTION_KEY }}" \
          --set secrets.OPENSEARCH_HOST="${{ secrets.OPENSEARCH_HOST }}" \
          --set secrets.DB_POSTGRESDB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
          --wait \
          --timeout 10m

    - name: Verify deployment
      run: |
        kubectl rollout status deployment/flow --namespace flow --timeout=300s
        kubectl get pods --namespace flow