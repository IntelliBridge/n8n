name: Deploy Flow

# Reusable deploy for the customized N8N ("flow") image to ECS.
#
# Replaces the previous EC2 + SSM rollout. Both the main and worker services run
# the SAME image with different commands, and n8n requires them on matching
# versions — so this workflow deploys both task-definition families in one job
# rather than splitting per service. Main is deployed first because it runs the
# database migrations on boot.

on:
  workflow_call:
    inputs:
      deployment-environment:
        description: 'Label used for alerts only, e.g. staging / production'
        type: string
        required: true
      deployment-role:
        description: 'IAM role assumed via GitHub OIDC'
        type: string
        required: true
      ecr-uri:
        type: string
        required: true
      cluster-name:
        type: string
        required: true
      main-service-name:
        type: string
        required: true
      worker-service-name:
        type: string
        required: true
      main-taskdef-file:
        type: string
        required: true
      worker-taskdef-file:
        type: string
        required: true
      secret-manager-arn:
        description: 'Runtime secret. Every key becomes a task secret of the same name.'
        type: string
        required: true
      readiness-url:
        description: 'Public readiness endpoint verified after deploy'
        type: string
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Resolve image tag (n8n version + git sha)
        id: meta
        env:
          ECR_URI: ${{ inputs.ecr-uri }}
        run: |
          set -e
          N8N_VERSION=$(node -p "require('./package.json').version")
          IMAGE_TAG="${N8N_VERSION}-$(git rev-parse --short HEAD)"
          echo "n8n_version=${N8N_VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${ECR_URI}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref_stable=${ECR_URI}:stable" >> "$GITHUB_OUTPUT"

      - name: Install & compile
        run: |
          pnpm install --frozen-lockfile
          pnpm build:deploy

      - name: Free disk space for the image build
        # The n8n image is large enough that a stock runner can run out of space
        # during buildx export. None of these preinstalled toolchains are used here.
        run: |
          set -eu
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /opt/ghc || true
          docker image prune --all --force || true
          df -h /

      - name: Build image
        # Fargate runs x86_64 — pin the platform so a non-amd64 builder cannot
        # produce an image that fails with "exec format error".
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg N8N_VERSION=${{ steps.meta.outputs.n8n_version }} \
            --build-arg N8N_RELEASE_TYPE=stable \
            -t ${{ steps.meta.outputs.image_ref }} \
            --load \
            -f docker/images/n8n/Dockerfile .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image_ref }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.deployment-role }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
          IMAGE_REF_STABLE: ${{ steps.meta.outputs.image_ref_stable }}
        run: |
          set -e
          docker tag "$IMAGE_REF" "$IMAGE_REF_STABLE"
          docker push "$IMAGE_REF"
          docker push "$IMAGE_REF_STABLE"

      - name: Fetch task-definition secrets
        # Every key in the runtime secret becomes a task secret of the same name,
        # so adding a key to Secrets Manager wires it without a code change.
        id: ecs-secrets-map
        env:
          SECRET_MANAGER_ARN: ${{ inputs.secret-manager-arn }}
        run: |
          echo "ecs_secrets<<END_OF_ECS_SECRETS" >> $GITHUB_OUTPUT
          aws secretsmanager get-secret-value --secret-id ${SECRET_MANAGER_ARN} --query SecretString --output text | \
            yq 'keys | .[] | "\(.)='"${SECRET_MANAGER_ARN}"':\(.)::"' >> $GITHUB_OUTPUT
          echo "END_OF_ECS_SECRETS" >> $GITHUB_OUTPUT

      # --- main service -------------------------------------------------------
      # Deployed first: the main process runs database migrations on boot.

      - name: Render main task definition
        id: taskdef-main
        uses: aws-actions/amazon-ecs-render-task-definition@cf6bad72997cc8abcbc836ea5534f2e1e3719ec6
        with:
          container-name: flow
          image: ${{ steps.meta.outputs.image_ref }}
          task-definition: ${{ inputs.main-taskdef-file }}
          # secrets are ignored unless a non-null environment-variables string is present
          environment-variables: 'DUMMY=1'
          secrets: ${{ steps.ecs-secrets-map.outputs.ecs_secrets }}

      - name: Render main runner sidecar
        # The runner image is upstream's, tagged with the upstream version — the same
        # value package.json gives the flow image tag. Derived here rather than pinned in
        # the task definition so the two can never drift; n8n requires them to match.
        id: taskdef-main-runners
        uses: aws-actions/amazon-ecs-render-task-definition@cf6bad72997cc8abcbc836ea5534f2e1e3719ec6
        with:
          container-name: runners
          image: n8nio/runners:${{ steps.meta.outputs.n8n_version }}
          task-definition: ${{ steps.taskdef-main.outputs.task-definition }}

      - name: Deploy main service
        id: deploy-main
        uses: aws-actions/amazon-ecs-deploy-task-definition@df9643053eda01f169e64a0e60233aacca83799a
        with:
          task-definition: ${{ steps.taskdef-main-runners.outputs.task-definition }}
          service: ${{ inputs.main-service-name }}
          cluster: ${{ inputs.cluster-name }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      # --- worker service ----------------------------------------------------

      - name: Render worker task definition
        id: taskdef-worker
        uses: aws-actions/amazon-ecs-render-task-definition@cf6bad72997cc8abcbc836ea5534f2e1e3719ec6
        with:
          container-name: flow
          image: ${{ steps.meta.outputs.image_ref }}
          task-definition: ${{ inputs.worker-taskdef-file }}
          environment-variables: 'DUMMY=1'
          secrets: ${{ steps.ecs-secrets-map.outputs.ecs_secrets }}

      - name: Render worker runner sidecar
        id: taskdef-worker-runners
        uses: aws-actions/amazon-ecs-render-task-definition@cf6bad72997cc8abcbc836ea5534f2e1e3719ec6
        with:
          container-name: runners
          image: n8nio/runners:${{ steps.meta.outputs.n8n_version }}
          task-definition: ${{ steps.taskdef-worker.outputs.task-definition }}

      - name: Deploy worker service
        id: deploy-worker
        uses: aws-actions/amazon-ecs-deploy-task-definition@df9643053eda01f169e64a0e60233aacca83799a
        with:
          task-definition: ${{ steps.taskdef-worker-runners.outputs.task-definition }}
          service: ${{ inputs.worker-service-name }}
          cluster: ${{ inputs.cluster-name }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      # --- verification ------------------------------------------------------

      - name: Verify both services landed on the new revisions
        env:
          CLUSTER_NAME: ${{ inputs.cluster-name }}
          MAIN_SERVICE: ${{ inputs.main-service-name }}
          WORKER_SERVICE: ${{ inputs.worker-service-name }}
          MAIN_ARN: ${{ steps.deploy-main.outputs.task-definition-arn }}
          WORKER_ARN: ${{ steps.deploy-worker.outputs.task-definition-arn }}
        run: |
          set -e
          fail=0
          for pair in "$MAIN_SERVICE:$MAIN_ARN" "$WORKER_SERVICE:$WORKER_ARN"; do
            svc="${pair%%:arn*}"
            want="${pair#*:}"
            got=$(aws ecs describe-services --cluster "$CLUSTER_NAME" --service "$svc" \
              --query 'services[0].deployments[0].taskDefinition' --output text)
            echo "$svc -> current: $got"
            echo "$svc -> expected: $want"
            if [ "$got" != "$want" ]; then
              echo "::error::$svc is not running the revision this run registered"
              fail=1
            fi
          done
          exit $fail

      - name: Verify readiness endpoint
        env:
          READINESS_URL: ${{ inputs.readiness-url }}
        run: |
          set -e
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$READINESS_URL/healthz/readiness" || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::readiness endpoint did not return 200"
          exit 1
